name: 🗞️ Enviar Semanario (respaldo manual)

on:
  # El envío automático del martes lo hace el cron del bot (Hermes) con
  # scripts/enviar.mjs + .env local. Este workflow queda solo como respaldo:
  # disparo manual desde la pestaña Actions.
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Enviar la edición más reciente
        run: node scripts/enviar.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_REGION: ${{ secrets.MAILGUN_REGION }}
          MAILGUN_FROM: ${{ secrets.MAILGUN_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
